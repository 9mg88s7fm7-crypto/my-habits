<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="format-detection" content="telephone=no">
    <meta name="color-scheme" content="light dark">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Habits">
    <meta name="theme-color" content="#FAF7F2" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#1C1C1E" media="(prefers-color-scheme: dark)">
    
    <title>Habit Tracker</title>

    <style>
        :root {
            --bg: #F8F9FB;
            --card: #FFFFFF;
            --text: #1C1C1E;
            --text-2: #8E8E93;
            --sep: #E5E5EA;
            --border: rgba(0,0,0,0.06);
            --input-bg: #F2F2F7;
            --blue: #FF5A79;
            --red: #FF3B30;
            --accent-pink: #FFF0F3;
            --accent-soft: #FF6B8B;

            --peach: #FF9B85;
            --pink: #FF85A1;
            --sage: #7BDCB5;
            --sky: #70C1FF;
            --lav: #B388FF;
            --yellow: #FFD166;
            --terra: #E07A5F;

            --safe-top: env(safe-area-inset-top, 20px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
            --tabbar-h: 60px;
        }

        [data-theme="dark"] {
            --bg: #121214;
            --card: #1C1C1E;
            --text: #FFFFFF;
            --text-2: #8E8E93;
            --sep: #2C2C2E;
            --border: rgba(255,255,255,0.08);
            --input-bg: #2C2C2E;
            --blue: #FF6B8B;
            --red: #FF453A;
            --accent-pink: #2C1A20;
        }

        * {
            margin: 0; padding: 0; box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            user-select: none;
        }

        html, body {
            height: 100%;
            overflow: hidden;
            background: var(--bg);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Rounded", "SF Pro Text", system-ui, sans-serif;
            font-size: 16px; line-height: 1.4;
            color: var(--text);
            touch-action: manipulation;
            transition: background 0.25s, color 0.25s;
        }

        .app { display: flex; flex-direction: column; height: 100dvh; width: 100%; }

        /* ---------- HEADER ---------- */
        .app-header {
            padding-top: var(--safe-top);
            padding-bottom: 8px;
            background: var(--bg);
            z-index: 20; flex-shrink: 0;
        }
        .header-top {
            height: 48px; display: flex; align-items: center; justify-content: space-between;
            padding: 0 20px;
        }
        .header-title { font-size: 22px; font-weight: 800; letter-spacing: -0.5px; }
        .header-sub { font-size: 13px; color: var(--text-2); font-weight: 600; margin-top: 1px; }
        .hdr-btn {
            width: 38px; height: 38px; border: none; background: var(--accent-pink);
            color: var(--blue); font-size: 24px; font-weight: 600; line-height: 1;
            display: flex; align-items: center; justify-content: center; border-radius: 50%;
            cursor: pointer;
        }
        .hdr-btn:active { opacity: 0.7; transform: scale(0.95); }

        /* ---------- CONTENT ---------- */
        .content {
            flex: 1; overflow-y: auto; overscroll-behavior-y: contain;
            -webkit-overflow-scrolling: touch;
            padding-bottom: calc(var(--tabbar-h) + var(--safe-bottom) + 20px);
        }
        .tab-page { display: none; animation: fade 0.25s ease; padding: 0 16px; }
        .tab-page.active { display: block; }
        @keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

        /* ---------- HOME ---------- */
        .habit-list { display: flex; flex-direction: column; gap: 10px; margin-top: 8px; }
        .habit-card {
            background: var(--card); border-radius: 20px; padding: 14px 16px;
            display: flex; align-items: center; justify-content: space-between;
            box-shadow: 0 2px 8px rgba(0,0,0,0.02); border: 1px solid var(--border);
        }
        .habit-left { display: flex; align-items: center; gap: 12px; flex: 1; min-width: 0; }
        .habit-emoji-bg {
            width: 46px; height: 46px; border-radius: 14px;
            display: flex; align-items: center; justify-content: center; font-size: 22px;
            background: var(--input-bg); flex-shrink: 0;
        }
        .habit-info { flex: 1; min-width: 0; }
        .habit-title { font-size: 16px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .habit-sub { font-size: 12px; color: var(--text-2); font-weight: 500; margin-top: 2px; }
        
        .habit-check {
            width: 36px; height: 36px; border-radius: 50%; border: 2.5px solid var(--hc);
            background: transparent; display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
            flex-shrink: 0;
        }
        .habit-check.done {
            background: var(--hc); border-color: var(--hc); transform: scale(1.05);
        }
        .habit-check.done::after {
            content: '✓'; color: #FFF; font-weight: 800; font-size: 18px;
        }

        .empty-state { text-align: center; padding: 60px 20px; color: var(--text-2); }
        .empty-emoji { font-size: 48px; margin-bottom: 12px; }
        .empty-title { font-size: 18px; font-weight: 700; color: var(--text); margin-bottom: 4px; }

        /* ---------- STATS (WEEKLY REPORT) ---------- */
        .report-card {
            background: var(--card); border-radius: 24px; padding: 18px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.03); border: 1px solid var(--border);
            margin-top: 8px; margin-bottom: 16px;
        }
        .report-header {
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 16px;
        }
        .report-title-box { display: flex; align-items: center; gap: 6px; }
        .report-title { font-size: 22px; font-weight: 900; color: #FF5A79; letter-spacing: -0.5px; font-family: cursive, sans-serif; }
        
        .week-nav { display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 16px; }
        .week-pill {
            background: #FFF3A7; color: #1C1C1E; font-weight: 800; font-size: 13px;
            padding: 4px 12px; border-radius: 12px; letter-spacing: 0.3px;
        }
        .nav-arrow {
            width: 24px; height: 24px; border-radius: 50%; background: #FF5A79; color: #FFF;
            border: none; display: flex; align-items: center; justify-content: center;
            font-size: 12px; font-weight: 800; cursor: pointer;
        }

        .report-grid { width: 100%; border-collapse: collapse; }
        .report-grid th { font-size: 11px; font-weight: 700; color: var(--text-2); padding-bottom: 10px; text-align: center; }
        .report-grid td { padding: 6px 2px; text-align: center; }
        .cell-habit {
            display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700;
            text-align: left; max-width: 110px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        .cell-pill {
            width: 28px; height: 28px; border-radius: 8px; margin: 0 auto;
            background: #EBF3FA; display: flex; align-items: center; justify-content: center;
            transition: all 0.2s;
        }
        .cell-pill.done { background: var(--hc, #70C1FF); opacity: 0.85; }
        .cell-pill.done::after { content: '🌸'; font-size: 12px; }
        
        .best-day-row td { padding-top: 10px; border-top: 1px dashed var(--border); }
        .best-day-pill {
            width: 26px; height: 26px; border-radius: 50%; background: #FFE8A3;
            display: inline-flex; align-items: center; justify-content: center; font-size: 12px;
        }

        /* Stats Grid Bottom */
        .stats-summary { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 16px; }
        .stat-box {
            background: var(--bg); border-radius: 16px; padding: 10px 4px; text-align: center;
        }
        .stat-val { font-size: 20px; font-weight: 900; line-height: 1.1; }
        .stat-val.red { color: #FF5A79; }
        .stat-val.blue { color: #70C1FF; }
        .stat-val.green { color: #7BDCB5; }
        .stat-val.orange { color: #FF9B85; }
        .stat-lbl { font-size: 10px; font-weight: 700; color: var(--text-2); margin-top: 4px; }

        /* ---------- CALENDAR TAB ---------- */
        .habit-selector {
            display: flex; gap: 10px; overflow-x: auto; padding: 4px 0 12px;
            -webkit-overflow-scrolling: touch;
        }
        .habit-selector::-webkit-scrollbar { display: none; }
        .sel-chip {
            padding: 8px 14px; border-radius: 20px; background: var(--card);
            border: 1px solid var(--border); font-size: 13px; font-weight: 700;
            display: flex; align-items: center; gap: 6px; white-space: nowrap; cursor: pointer;
        }
        .sel-chip.active { background: #FF5A79; color: #FFF; border-color: #FF5A79; }

        .cal-card {
            background: var(--card); border-radius: 24px; padding: 18px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.03); border: 1px solid var(--border);
            margin-bottom: 16px;
        }
        .cal-head-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
        .cal-title { font-size: 16px; font-weight: 800; }
        .cal-grid-7 { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; text-align: center; }
        .cal-dow-name { font-size: 11px; font-weight: 700; color: var(--text-2); margin-bottom: 6px; }
        .cal-day-cell {
            aspect-ratio: 1; border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-size: 13px; font-weight: 700; border: 1px solid transparent; position: relative;
        }
        .cal-day-cell.other { color: var(--sep); }
        .cal-day-cell.done { border-color: #FF85A1; color: #FF5A79; background: var(--accent-pink); }
        .cal-day-cell.done::after {
            content: '👑'; font-size: 9px; position: absolute; top: -4px;
        }

        /* Yearly Heatmap */
        .yearly-card {
            background: var(--card); border-radius: 20px; padding: 16px;
            border: 1px solid var(--border); margin-bottom: 16px;
        }
        .yearly-title { font-size: 14px; font-weight: 800; margin-bottom: 10px; display: flex; justify-content: space-between; }
        .heatmap-grid { display: grid; grid-template-rows: repeat(7, 1fr); grid-auto-flow: column; gap: 3px; overflow-x: auto; padding-bottom: 4px; }
        .heatmap-grid::-webkit-scrollbar { display: none; }
        .hm-cell { width: 10px; height: 10px; border-radius: 2px; background: #F0F0F2; }
        [data-theme="dark"] .hm-cell { background: #2C2C2E; }
        .hm-cell.l1 { background: #FFD1D9; }
        .hm-cell.l2 { background: #FF85A1; }
        .hm-cell.l3 { background: #FF5A79; }

        /* ---------- SETTINGS ---------- */
        .set-group { background: var(--card); border-radius: 20px; margin-bottom: 16px; border: 1px solid var(--border); overflow: hidden; }
        .set-row {
            display: flex; align-items: center; justify-content: space-between;
            padding: 14px 16px; border-bottom: 1px solid var(--border);
        }
        .set-row:last-child { border-bottom: none; }
        .set-lbl { font-size: 15px; font-weight: 600; }
        .btn-block {
            width: 100%; border: none; background: var(--card); border-radius: 16px;
            padding: 14px; font-size: 15px; font-weight: 700; color: var(--text);
            margin-bottom: 8px; border: 1px solid var(--border); cursor: pointer;
        }
        .btn-block.danger { color: var(--red); }

        /* ---------- SHEETS ---------- */
        .sheet-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 200;
            opacity: 0; pointer-events: none; transition: opacity 0.25s;
            display: flex; align-items: flex-end;
        }
        .sheet-overlay.open { opacity: 1; pointer-events: auto; }
        .sheet {
            width: 100%; background: var(--card); border-radius: 28px 28px 0 0;
            padding: 12px 20px calc(20px + var(--safe-bottom));
            transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.2, 0.9, 0.2, 1);
            max-height: 90dvh; overflow-y: auto;
        }
        .sheet-overlay.open .sheet { transform: translateY(0); }
        .grabber { width: 36px; height: 5px; background: var(--sep); border-radius: 3px; margin: 0 auto 12px; }
        .sheet-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
        .sheet-title { font-size: 17px; font-weight: 800; }
        .sheet-btn { border: none; background: none; font-size: 16px; font-weight: 700; color: var(--blue); cursor: pointer; }

        .f-group { margin-bottom: 16px; }
        .form-label { font-size: 12px; font-weight: 700; color: var(--text-2); text-transform: uppercase; margin-bottom: 6px; }
        .form-input {
            width: 100%; border: none; background: var(--input-bg); border-radius: 12px;
            padding: 12px 14px; font-size: 16px; color: var(--text); outline: none; font-family: inherit;
        }

        .chip-row { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
        .chip-row::-webkit-scrollbar { display: none; }
        .chip-emoji {
            flex: 0 0 42px; height: 42px; border-radius: 12px; background: var(--input-bg);
            border: 2px solid transparent; font-size: 20px; display: flex; align-items: center; justify-content: center; cursor: pointer;
        }
        .chip-emoji.active { border-color: var(--blue); background: var(--card); }

        .chip-color {
            flex: 0 0 34px; height: 34px; border-radius: 50%; border: 3px solid transparent; cursor: pointer;
        }
        .chip-color.active { border-color: var(--text); transform: scale(1.1); }

        /* ---------- TABBAR ---------- */
        .tabbar {
            position: fixed; bottom: 0; left: 0; right: 0;
            height: calc(var(--tabbar-h) + var(--safe-bottom)); padding-bottom: var(--safe-bottom);
            background: var(--card); border-top: 1px solid var(--border);
            display: flex; align-items: center; justify-content: space-around;
            z-index: 100;
        }
        .tab-btn {
            flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px;
            background: none; border: none; color: var(--text-2); font-size: 10px; font-weight: 700;
            cursor: pointer;
        }
        .tab-btn.active { color: var(--blue); }
        .tab-ico { font-size: 20px; }

        .toast {
            position: fixed; top: calc(var(--safe-top) + 10px); left: 50%;
            transform: translateX(-50%) translateY(-140%);
            background: rgba(0,0,0,0.85); color: #fff; padding: 10px 18px; border-radius: 20px;
            font-size: 13px; font-weight: 700; z-index: 300; transition: transform 0.3s;
            backdrop-filter: blur(10px); white-space: nowrap;
        }
        .toast.show { transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body>

<div class="app">
    <header class="app-header">
        <div class="header-top">
            <div>
                <div class="header-title" id="pageTitle">Habits</div>
                <div class="header-sub" id="pageSub">Today</div>
            </div>
            <button class="hdr-btn" id="btnAdd">+</button>
        </div>
    </header>

    <main class="content">
        <!-- HOME PAGE -->
        <section class="tab-page active" id="page-home">
            <div id="homeList"></div>
        </section>

        <!-- STATS PAGE (WEEKLY REPORT) -->
        <section class="tab-page" id="page-stats">
            <div class="report-card">
                <div class="report-header">
                    <div class="report-title-box">
                        <span style="font-size: 20px;">☀️</span>
                        <span class="report-title">Habit Tracker</span>
                        <span style="font-size: 20px;">🌙</span>
                    </div>
                </div>

                <div class="week-nav">
                    <button class="nav-arrow" id="wkPrev">‹</button>
                    <div class="week-pill" id="weekRangeStr">12/28~01/03</div>
                    <button class="nav-arrow" id="wkNext">›</button>
                </div>

                <table class="report-grid">
                    <thead>
                        <tr>
                            <th style="text-align: left; padding-left: 4px;">S</th>
                            <th>M</th><th>T</th><th>W</th><th>T</th><th>F</th><th>S</th>
                        </tr>
                    </thead>
                    <tbody id="reportTableBody"></tbody>
                </table>

                <div class="stats-summary">
                    <div class="stat-box">
                        <div class="stat-val red" id="stPct">100%</div>
                        <div class="stat-lbl">Met</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-val blue" id="stBestDay">7d</div>
                        <div class="stat-lbl">BestDay</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-val green" id="stTotal">56</div>
                        <div class="stat-lbl">TotalDone</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-val orange" id="stStreak">7d</div>
                        <div class="stat-lbl">BestStreak</div>
                    </div>
                </div>
            </div>
        </section>

        <!-- CALENDAR PAGE -->
        <section class="tab-page" id="page-calendar">
            <div class="habit-selector" id="calHabitSelector"></div>

            <div class="cal-card">
                <div class="cal-head-nav">
                    <button class="nav-arrow" id="calPrevM">‹</button>
                    <div class="cal-title" id="calMonthTitle">2026 / 01</div>
                    <button class="nav-arrow" id="calNextM">›</button>
                </div>
                <div class="cal-grid-7" id="calGrid"></div>
            </div>

            <div class="yearly-card">
                <div class="yearly-title">
                    <span>Yearly Status</span>
                    <span style="color: var(--text-2); font-size: 12px;" id="yearlyYearLabel">2026</span>
                </div>
                <div class="heatmap-grid" id="heatmapGrid"></div>
            </div>
        </section>

        <!-- SETTINGS PAGE -->
        <section class="tab-page" id="page-settings">
            <div class="set-group" style="margin-top: 8px;">
                <div class="set-row">
                    <span class="set-lbl">Темный режим</span>
                    <input type="checkbox" id="toggleTheme">
                </div>
            </div>
            <button class="btn-block" id="btnExport">Экспорт данных (JSON)</button>
            <button class="btn-block" id="btnImport">Импорт данных</button>
            <input type="file" id="fileImport" accept=".json" style="display:none">
            <button class="btn-block danger" id="btnClear">Очистить все данные</button>
        </section>
    </main>

    <nav class="tabbar">
        <button class="tab-btn active" data-tab="home">
            <span class="tab-ico">🏠</span><span>Главная</span>
        </button>
        <button class="tab-btn" data-tab="stats">
            <span class="tab-ico">📊</span><span>Отчет</span>
        </button>
        <button class="tab-btn" data-tab="calendar">
            <span class="tab-ico">📅</span><span>Календарь</span>
        </button>
        <button class="tab-btn" data-tab="settings">
            <span class="tab-ico">⚙️</span><span>Опции</span>
        </button>
    </nav>
</div>

<!-- FORM SHEET -->
<div class="sheet-overlay" id="formSheet">
    <div class="sheet">
        <div class="grabber"></div>
        <div class="sheet-head">
            <button class="sheet-btn" id="formCancel">Отмена</button>
            <div class="sheet-title" id="formTitle">Привычка</div>
            <button class="sheet-btn" id="formSave">Готово</button>
        </div>

        <div class="f-group">
            <div class="form-label">Иконка</div>
            <div class="chip-row" id="emojiRow"></div>
        </div>

        <div class="f-group">
            <div class="form-label">Название</div>
            <input class="form-input" id="fName" type="text" placeholder="Зарядка, Пить воду...">
        </div>

        <div class="f-group">
            <div class="form-label">Цвет</div>
            <div class="chip-row" id="colorRow"></div>
        </div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function() {
'use strict';

const COLORS = [
  {id:'peach', hex:'#FF9B85'}, {id:'pink', hex:'#FF85A1'}, {id:'sage', hex:'#7BDCB5'},
  {id:'sky', hex:'#70C1FF'}, {id:'lav', hex:'#B388FF'}, {id:'yellow', hex:'#FFD166'}
];
const EMOJIS = ['💧','🧘','🥗','🍳','🚶‍♀️','🏃‍♂️','🧘‍♀️','💰','📚','🎸','😴','💊'];

const DEFAULT_STATE = {
  habits: [
    {id:'h1', emoji:'💧', name:'Drink water', color:'sky'},
    {id:'h2', emoji:'🧘‍♀️', name:'Yoga', color:'pink'},
    {id:'h3', emoji:'🥗', name:'Eat Healthy', color:'sage'},
    {id:'h4', emoji:'🚶‍♀️', name:'Walk', color:'peach'}
  ],
  records: {},
  settings: { theme: 'light' }
};

let state = load();
let currentTab = 'home';
let weekOffset = 0;
let selectedHabitId = state.habits[0] ? state.habits[0].id : null;
let calDate = new Date();

let formEmoji = '💧';
let formColor = 'sky';
let editingId = null;

function load() {
  try {
    const raw = localStorage.getItem('habitflow_v2');
    if (!raw) return JSON.parse(JSON.stringify(DEFAULT_STATE));
    return JSON.parse(raw);
  } catch(e) { return JSON.parse(JSON.stringify(DEFAULT_STATE)); }
}
function save() {
  try { localStorage.setItem('habitflow_v2', JSON.stringify(state)); } catch(e) {}
}

function hex(cid){ const c = COLORS.find(x=>x.id===cid); return c ? c.hex : '#70C1FF'; }
function dKey(d){
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function toast(msg){
  const el=document.getElementById('toast'); el.textContent=msg; el.classList.add('show');
  clearTimeout(el._t); el._t=setTimeout(()=>el.classList.remove('show'),1800);
}

/* Home */
function renderHome(){
  const wrap = document.getElementById('homeList');
  if(state.habits.length === 0){
    wrap.innerHTML = `<div class="empty-state"><div class="empty-emoji">🌱</div><div class="empty-title">Нет привычек</div></div>`;
    return;
  }
  let html = `<div class="habit-list">`;
  const todayKey = dKey(new Date());
  
  state.habits.forEach(h => {
    const done = state.records[todayKey] && state.records[todayKey][h.id];
    html += `
      <div class="habit-card" data-id="${h.id}">
        <div class="habit-left">
          <div class="habit-emoji-bg">${h.emoji}</div>
          <div class="habit-info">
            <div class="habit-title">${h.name}</div>
            <div class="habit-sub">Каждый день</div>
          </div>
        </div>
        <button class="habit-check ${done?'done':''}" style="--hc:${hex(h.color)}" data-toggle="${h.id}"></button>
      </div>
    `;
  });
  html += `</div>`;
  wrap.innerHTML = html;

  wrap.querySelectorAll('[data-toggle]').forEach(btn => {
    btn.onclick = (e) => {
      e.stopPropagation();
      const id = btn.getAttribute('data-toggle');
      if(!state.records[todayKey]) state.records[todayKey] = {};
      state.records[todayKey][id] = !state.records[todayKey][id];
      save(); renderHome();
    };
  });
}

/* Weekly Report */
function renderStats(){
  const now = new Date();
  const startOfWeek = new Date(now);
  startOfWeek.setDate(now.getDate() - now.getDay() + (weekOffset * 7));

  const endOfWeek = new Date(startOfWeek);
  endOfWeek.setDate(startOfWeek.getDate() + 6);

  const fmt = (d) => `${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}`;
  document.getElementById('weekRangeStr').textContent = `${fmt(startOfWeek)}~${fmt(endOfWeek)}`;

  const tbody = document.getElementById('reportTableBody');
  tbody.innerHTML = '';

  let totalScheduled = state.habits.length * 7;
  let totalDoneCount = 0;
  let dayDoneCounts = [0,0,0,0,0,0,0];

  state.habits.forEach(h => {
    const tr = document.createElement('tr');
    let rowHtml = `<td><div class="cell-habit"><span>${h.emoji}</span><span>${h.name}</span></div></td>`;
    
    for(let i=0; i<7; i++){
      const d = new Date(startOfWeek);
      d.setDate(startOfWeek.getDate() + i);
      const k = dKey(d);
      const isDone = state.records[k] && state.records[k][h.id];
      if(isDone) {
        totalDoneCount++;
        dayDoneCounts[i]++;
      }
      rowHtml += `<td><div class="cell-pill ${isDone?'done':''}" style="--hc:${hex(h.color)}"></div></td>`;
    }
    tr.innerHTML = rowHtml;
    tbody.appendChild(tr);
  });

  const bestDayTr = document.createElement('tr');
  bestDayTr.className = 'best-day-row';
  let bestDayHtml = `<td><div class="cell-habit" style="color:var(--text-2)">BestDay</div></td>`;
  const maxDoneInDay = Math.max(...dayDoneCounts);

  for(let i=0; i<7; i++){
    const isBest = dayDoneCounts[i] > 0 && dayDoneCounts[i] === maxDoneInDay;
    bestDayHtml += `<td>${isBest ? '<div class="best-day-pill">👑</div>' : ''}</td>`;
  }
  bestDayTr.innerHTML = bestDayHtml;
  tbody.appendChild(bestDayTr);

  const pct = totalScheduled > 0 ? Math.round((totalDoneCount / totalScheduled) * 100) : 0;
  document.getElementById('stPct').textContent = `${pct}%`;
  document.getElementById('stTotal').textContent = totalDoneCount;
  document.getElementById('stBestDay').textContent = `${maxDoneInDay}d`;
  document.getElementById('stStreak').textContent = `${totalDoneCount > 0 ? 7 : 0}d`;
}

document.getElementById('wkPrev').onclick = () => { weekOffset--; renderStats(); };
document.getElementById('wkNext').onclick = () => { weekOffset++; renderStats(); };

/* Calendar View */
function renderCalendar(){
  const sel = document.getElementById('calHabitSelector');
  sel.innerHTML = '';
  state.habits.forEach(h => {
    const chip = document.createElement('div');
    chip.className = `sel-chip ${h.id === selectedHabitId ? 'active' : ''}`;
    chip.innerHTML = `<span>${h.emoji}</span><span>${h.name}</span>`;
    chip.onclick = () => { selectedHabitId = h.id; renderCalendar(); };
    sel.appendChild(chip);
  });

  const y = calDate.getFullYear();
  const m = calDate.getMonth();
  document.getElementById('calMonthTitle').textContent = `${y} / ${String(m+1).padStart(2,'0')}`;

  const grid = document.getElementById('calGrid');
  grid.innerHTML = '';

  ['S','M','T','W','T','F','S'].forEach(d => {
    grid.innerHTML += `<div class="cal-dow-name">${d}</div>`;
  });

  const firstDay = new Date(y, m, 1).getDay();
  const daysInMonth = new Date(y, m+1, 0).getDate();

  for(let i=0; i<firstDay; i++){
    grid.innerHTML += `<div class="cal-day-cell other"></div>`;
  }

  for(let day=1; day<=daysInMonth; day++){
    const d = new Date(y, m, day);
    const k = dKey(d);
    const isDone = selectedHabitId && state.records[k] && state.records[k][selectedHabitId];
    grid.innerHTML += `<div class="cal-day-cell ${isDone?'done':''}">${day}</div>`;
  }

  renderHeatmap();
}

document.getElementById('calPrevM').onclick = () => { calDate.setMonth(calDate.getMonth()-1); renderCalendar(); };
document.getElementById('calNextM').onclick = () => { calDate.setMonth(calDate.getMonth()+1); renderCalendar(); };

function renderHeatmap(){
  const hm = document.getElementById('heatmapGrid');
  hm.innerHTML = '';
  const y = calDate.getFullYear();
  document.getElementById('yearlyYearLabel').textContent = y;

  for(let i=0; i<105; i++){
    const rand = Math.random();
    let lvl = '';
    if(rand > 0.7) lvl = 'l1';
    if(rand > 0.85) lvl = 'l2';
    if(rand > 0.95) lvl = 'l3';
    hm.innerHTML += `<div class="hm-cell ${lvl}"></div>`;
  }
}

/* Form Sheet */
function openForm(){
  document.getElementById('fName').value = '';
  renderEmojiPicker(); renderColorPicker();
  document.getElementById('formSheet').classList.add('open');
}
function closeForm(){ document.getElementById('formSheet').classList.remove('open'); }

function renderEmojiPicker(){
  const r = document.getElementById('emojiRow'); r.innerHTML = '';
  EMOJIS.forEach(e => {
    const b = document.createElement('div');
    b.className = `chip-emoji ${e===formEmoji?'active':''}`;
    b.textContent = e;
    b.onclick = () => { formEmoji = e; renderEmojiPicker(); };
    r.appendChild(b);
  });
}

function renderColorPicker(){
  const r = document.getElementById('colorRow'); r.innerHTML = '';
  COLORS.forEach(c => {
    const b = document.createElement('div');
    b.className = `chip-color ${c.id===formColor?'active':''}`;
    b.style.background = c.hex;
    b.onclick = () => { formColor = c.id; renderColorPicker(); };
    r.appendChild(b);
  });
}

document.getElementById('btnAdd').onclick = openForm;
document.getElementById('formCancel').onclick = closeForm;
document.getElementById('formSave').onclick = () => {
  const name = document.getElementById('fName').value.trim();
  if(!name) return;
  state.habits.push({ id: 'h'+Date.now(), emoji: formEmoji, name, color: formColor });
  save(); closeForm(); renderHome(); toast('Сохранено');
};

/* Tabs */
document.querySelectorAll('.tab-btn').forEach(b => {
  b.onclick = () => {
    document.querySelectorAll('.tab-btn').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    currentTab = b.getAttribute('data-tab');
    document.querySelectorAll('.tab-page').forEach(p => p.classList.remove('active'));
    document.getElementById(`page-${currentTab}`).classList.add('active');
    if(currentTab === 'home') renderHome();
    if(currentTab === 'stats') renderStats();
    if(currentTab === 'calendar') renderCalendar();
  };
});

/* Settings */
document.getElementById('toggleTheme').onchange = (e) => {
  document.documentElement.setAttribute('data-theme', e.target.checked ? 'dark' : 'light');
};

document.getElementById('btnExport').onclick = () => {
  const blob = new Blob([JSON.stringify(state, null, 2)], {type: 'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = `habits-backup.json`; a.click();
};

document.getElementById('btnImport').onclick = () => document.getElementById('fileImport').click();
document.getElementById('fileImport').onchange = (e) => {
  const f = e.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      state = JSON.parse(r.result); save(); renderHome(); toast('Импортировано');
    } catch(err) { toast('Ошибка файла'); }
  };
  r.readAsText(f);
};

document.getElementById('btnClear').onclick = () => {
  if(confirm('Удалить всё?')){
    state = { habits: [], records: {}, settings: {} }; save(); renderHome(); toast('Очищено');
  }
};

/* Init */
renderHome();
})();
</script>
</body>
</html>
